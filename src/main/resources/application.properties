spring.application.name=dynamicRole

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/dynamic_role?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:dynamic_role}
spring.datasource.password=${DB_PASSWORD:dynamic_role}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.enabled=true
