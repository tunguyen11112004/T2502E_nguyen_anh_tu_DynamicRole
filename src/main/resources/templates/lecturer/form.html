<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biên tập bài tập</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
<header th:replace="~{fragments/nav :: bar}"></header>
<main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-xs p-6 sm:p-8">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-900"
                    th:text="${assignmentId == null ? 'Tạo bài nháp' : 'Sửa bài tập'}">Bài tập</h1>
                <p class="text-sm text-slate-500 mt-1">Thiết lập tiêu đề, yêu cầu và thời hạn nộp bài.</p>
            </div>
            <span th:if="${assignment != null}"
                  th:text="${assignment.status}"
                  th:classappend="${assignment.status.name() == 'OPEN' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : (assignment.status.name() == 'CLOSED' ? 'bg-slate-100 text-slate-700 border-slate-300' : 'bg-amber-50 text-amber-700 border-amber-200')}"
                  class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold border">
            </span>
        </div>

        <div th:if="${error}" class="mb-4 rounded-xl bg-rose-50 border border-rose-200 px-4 py-3 text-sm text-rose-700" th:text="${error}"></div>
        <div th:if="${assignment != null and assignment.status.name() == 'CLOSED'}"
             class="mb-4 rounded-xl bg-amber-50 border border-amber-200 px-4 py-3 text-sm text-amber-800">
            Bài đã đóng. Không sửa nội dung và không mở lại.
        </div>

        <form th:action="@{${actionUrl}}" th:object="${form}" method="post" class="space-y-5">
            <div th:if="${#fields.hasGlobalErrors()}"
                 th:each="e : ${#fields.globalErrors()}"
                 th:text="${e}"
                 class="rounded-xl bg-rose-50 border border-rose-200 px-4 py-3 text-sm text-rose-700"></div>

            <div>
                <label for="title" class="block text-sm font-medium text-slate-700 mb-1.5">Tiêu đề</label>
                <input id="title" th:field="*{title}" maxlength="150" required
                       class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
                <span th:errors="*{title}" class="block mt-1 text-xs font-medium text-rose-600"></span>
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-slate-700 mb-1.5">Mô tả</label>
                <textarea id="description" th:field="*{description}" maxlength="4000" rows="5"
                          class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"></textarea>
                <span th:errors="*{description}" class="block mt-1 text-xs font-medium text-rose-600"></span>
            </div>

            <div>
                <label for="deadline" class="block text-sm font-medium text-slate-700 mb-1.5">Hạn nộp (giờ Việt Nam)</label>
                <input id="deadline" type="datetime-local" th:field="*{deadline}" required
                       class="w-full sm:w-72 rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
                <span th:errors="*{deadline}" class="block mt-1 text-xs font-medium text-rose-600"></span>
            </div>

            <div class="pt-2 flex flex-wrap items-center gap-3">
                <button type="submit"
                        th:if="${assignment == null or assignment.status.name() != 'CLOSED'}"
                        class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 shadow-xs transition cursor-pointer">
                    Lưu
                </button>
                <a th:href="@{/lecturer/assignments}"
                   class="px-5 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-700 text-sm font-medium hover:bg-slate-50 transition">
                    Quay lại
                </a>
            </div>
        </form>

        <div th:if="${assignment != null}" class="mt-8 pt-6 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
                <form th:if="${assignment.status.name() == 'DRAFT'}"
                      th:action="@{/lecturer/assignments/{id}/open(id=${assignment.id})}" method="post" class="inline m-0">
                    <button type="submit"
                            class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-700 shadow-xs transition cursor-pointer">
                        Mở bài
                    </button>
                </form>
                <form th:if="${assignment.status.name() == 'OPEN'}"
                      th:action="@{/lecturer/assignments/{id}/close(id=${assignment.id})}" method="post" class="inline m-0">
                    <button type="submit"
                            class="px-4 py-2 rounded-xl bg-rose-600 text-white text-sm font-medium hover:bg-rose-700 shadow-xs transition cursor-pointer">
                        Đóng bài
                    </button>
                </form>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <a th:href="@{/lecturer/assignments/{id}/students(id=${assignment.id})}"
                   class="px-4 py-2 rounded-xl border border-indigo-200 bg-indigo-50 text-indigo-700 text-sm font-medium hover:bg-indigo-100 transition">
                    Giao học viên
                </a>
                <a th:href="@{/lecturer/assignments/{id}/submissions(id=${assignment.id})}"
                   class="px-4 py-2 rounded-xl border border-slate-300 bg-white text-slate-700 text-sm font-medium hover:bg-slate-50 transition">
                    Xem bài nộp
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
