<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài nộp</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
<header th:replace="~{fragments/nav :: bar}"></header>
<main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
        <div>
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900" th:text="${assignment.title}">Bài nộp</h1>
            <p class="text-sm text-slate-500 mt-1">
                Trạng thái:
                <span class="font-semibold text-slate-700" th:text="${assignment.status}">OPEN</span>
            </p>
        </div>
        <a th:href="@{/lecturer/assignments/{id}/edit(id=${assignment.id})}"
           class="px-4 py-2 rounded-xl border border-slate-300 bg-white text-slate-700 text-sm font-medium hover:bg-slate-50 transition">
            Quay lại
        </a>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
        <div th:if="${submissions.empty}" class="p-8 text-center text-slate-500 text-sm">
            Chưa có bài nộp.
        </div>

        <div class="overflow-x-auto" th:if="${!submissions.empty}">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-50 border-b border-slate-200 text-xs font-semibold uppercase tracking-wider text-slate-500">
                <tr>
                    <th class="px-6 py-3.5">Học viên</th>
                    <th class="px-6 py-3.5">Nộp lúc</th>
                    <th class="px-6 py-3.5">Điểm</th>
                    <th class="px-6 py-3.5">Nhận xét / Thao tác</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 text-sm">
                <tr th:each="item : ${submissions.content}" class="hover:bg-slate-50/80 transition">
                    <td class="px-6 py-4 font-semibold text-indigo-600 whitespace-nowrap" th:text="${item.studentUsername}">hv</td>
                    <td class="px-6 py-4 text-slate-600 whitespace-nowrap" th:text="${item.submittedAtText}">lúc</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span th:if="${item.score != null}"
                              class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200"
                              th:text="${item.score}">0</span>
                        <span th:if="${item.score == null}" class="text-xs text-slate-400">Chưa chấm</span>
                    </td>
                    <td class="px-6 py-4">
                        <a th:if="${assignment.status.name() == 'CLOSED' and item.score == null}"
                           th:href="@{/lecturer/assignments/{id}/submissions/{submissionId}/grade(id=${assignment.id}, submissionId=${item.id})}"
                           class="inline-flex items-center px-3.5 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-medium hover:bg-indigo-700 shadow-xs transition">
                            Chấm
                        </a>
                        <span th:if="${item.score != null}" class="text-slate-700" th:text="${item.feedback}">Nhận xét</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:replace="~{fragments/nav :: pager(${submissions})}"></nav>
</main>
</body>
</html>
