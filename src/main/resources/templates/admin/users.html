<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài khoản</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
<header th:replace="~{fragments/nav :: bar}"></header>
<main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-6">
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">Tài khoản</h1>
        <p class="text-sm text-slate-500 mt-1">Chỉ quản trị được đổi vai trò tại đây. Form đăng ký không cấp quyền.</p>
    </div>

    <div th:if="${error}" class="mb-4 rounded-xl bg-rose-50 border border-rose-200 px-4 py-3 text-sm text-rose-700" th:text="${error}"></div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-50 border-b border-slate-200 text-xs font-semibold uppercase tracking-wider text-slate-500">
                <tr>
                    <th class="px-6 py-3.5">Tên</th>
                    <th class="px-6 py-3.5">Vai trò hiện tại</th>
                    <th class="px-6 py-3.5 text-right">Đổi vai trò</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 text-sm">
                <tr th:each="user : ${users.content}" class="hover:bg-slate-50/80 transition">
                    <td class="px-6 py-4 font-semibold text-slate-900" th:text="${user.username}">ten</td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200"
                              th:text="${user.roles}">ROLE</span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post" class="inline-flex items-center gap-2 m-0">
                            <select name="role"
                                    class="rounded-xl border border-slate-300 bg-white px-3 py-1.5 text-xs text-slate-900 focus:border-indigo-500 focus:outline-none">
                                <option th:each="choice : ${roleChoices}" th:value="${choice}" th:text="${choice}"></option>
                            </select>
                            <button type="submit"
                                    class="px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-medium hover:bg-indigo-700 shadow-xs transition cursor-pointer">
                                Cập nhật
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:replace="~{fragments/nav :: pager(${users})}"></nav>
</main>
</body>
</html>
