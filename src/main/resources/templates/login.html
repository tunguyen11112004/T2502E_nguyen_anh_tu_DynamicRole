<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased flex flex-col">
<header th:replace="~{fragments/nav :: bar}"></header>
<main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow-xs p-6 sm:p-8">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-slate-900">Đăng nhập</h1>
            <p class="text-sm text-slate-500 mt-1">Nhập thông tin tài khoản để truy cập hệ thống.</p>
        </div>

        <div th:if="${param.error}" class="mb-4 rounded-xl bg-rose-50 border border-rose-200 px-4 py-3 text-sm text-rose-700">
            Tên đăng nhập hoặc mật khẩu không đúng.
        </div>
        <div th:if="${param.logout}" class="mb-4 rounded-xl bg-emerald-50 border border-emerald-200 px-4 py-3 text-sm text-emerald-700">
            Bạn đã đăng xuất.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">Tên đăng nhập</label>
                <input id="username" name="username" maxlength="50" required
                       class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Mật khẩu</label>
                <input id="password" type="password" name="password" maxlength="72" required
                       class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
            </div>
            <div class="pt-2 flex flex-col gap-3">
                <button type="submit"
                        class="w-full py-2.5 px-4 rounded-xl bg-indigo-600 text-white font-medium text-sm hover:bg-indigo-700 shadow-xs transition cursor-pointer">
                    Đăng nhập
                </button>
                <p class="text-center text-sm text-slate-600">
                    Chưa có tài khoản?
                    <a th:href="@{/register}" class="font-medium text-indigo-600 hover:text-indigo-700">Đăng ký</a>
                </p>
            </div>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-200">
            <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Đăng nhập nhanh tài khoản mẫu</span>
                <span class="text-xs text-slate-400">MK: password1</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <form th:action="@{/login}" method="post" class="m-0">
                    <input type="hidden" name="username" value="hv_an">
                    <input type="hidden" name="password" value="password1">
                    <button type="submit"
                            class="w-full text-left p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-200 transition cursor-pointer">
                        <div class="text-xs font-semibold text-emerald-600">Học viên (STUDENT)</div>
                        <div class="text-sm font-bold text-slate-900 mt-0.5">hv_an</div>
                    </button>
                </form>

                <form th:action="@{/login}" method="post" class="m-0">
                    <input type="hidden" name="username" value="gv_minh">
                    <input type="hidden" name="password" value="password1">
                    <button type="submit"
                            class="w-full text-left p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-200 transition cursor-pointer">
                        <div class="text-xs font-semibold text-amber-600">Giảng viên (LECTURER)</div>
                        <div class="text-sm font-bold text-slate-900 mt-0.5">gv_minh</div>
                    </button>
                </form>

                <form th:action="@{/login}" method="post" class="m-0">
                    <input type="hidden" name="username" value="hv_binh">
                    <input type="hidden" name="password" value="password1">
                    <button type="submit"
                            class="w-full text-left p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-200 transition cursor-pointer">
                        <div class="text-xs font-semibold text-emerald-600">Học viên 2 (STUDENT)</div>
                        <div class="text-sm font-bold text-slate-900 mt-0.5">hv_binh</div>
                    </button>
                </form>

                <form th:action="@{/login}" method="post" class="m-0">
                    <input type="hidden" name="username" value="admin">
                    <input type="hidden" name="password" value="password1">
                    <button type="submit"
                            class="w-full text-left p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-200 transition cursor-pointer">
                        <div class="text-xs font-semibold text-purple-600">Quản trị (ADMIN)</div>
                        <div class="text-sm font-bold text-slate-900 mt-0.5">admin</div>
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
