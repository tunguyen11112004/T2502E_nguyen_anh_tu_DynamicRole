<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="bar" class="bg-white border-b border-slate-200 shadow-xs sticky top-0 z-30">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-6">
            <a th:href="@{/}" class="flex items-center gap-2 text-indigo-600 font-bold text-lg tracking-tight hover:text-indigo-700 transition">
                <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-indigo-600 text-white font-semibold text-sm">DR</span>
                <span>Trang chủ</span>
            </a>
            <div class="flex flex-wrap items-center gap-1 sm:gap-2 text-sm font-medium text-slate-600">
                <a sec:authorize="isAuthenticated()" th:href="@{/tasks}"
                   class="px-3 py-2 rounded-lg hover:bg-slate-100 hover:text-slate-900 transition">Công việc của tôi</a>
                <a sec:authorize="hasRole('STUDENT')" th:href="@{/student/assignments}"
                   class="px-3 py-2 rounded-lg hover:bg-slate-100 hover:text-slate-900 transition">Bài được giao</a>
                <a sec:authorize="hasRole('LECTURER')" th:href="@{/lecturer/assignments}"
                   class="px-3 py-2 rounded-lg hover:bg-slate-100 hover:text-slate-900 transition">Bài của tôi</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}"
                   class="px-3 py-2 rounded-lg hover:bg-slate-100 hover:text-slate-900 transition">Giám sát</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/tasks}"
                   class="px-3 py-2 rounded-lg hover:bg-slate-100 hover:text-slate-900 transition">Giám sát công việc</a>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <a sec:authorize="!isAuthenticated()" th:href="@{/login}"
               class="px-3.5 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100 transition">Đăng nhập</a>
            <a sec:authorize="!isAuthenticated()" th:href="@{/register}"
               class="px-3.5 py-2 rounded-lg text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-700 shadow-xs transition">Đăng ký</a>
            <span sec:authorize="isAuthenticated()" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-700">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span sec:authentication="name">user</span>
            </span>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
                <button type="submit"
                        class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-slate-700 border border-slate-300 hover:bg-slate-50 hover:text-rose-600 transition cursor-pointer">
                    Đăng xuất
                </button>
            </form>
        </div>
    </nav>
</header>

<nav th:fragment="pager(page)" class="mt-6 flex items-center justify-between border-t border-slate-200 pt-4 text-sm text-slate-600">
    <div>
        Trang <span class="font-semibold text-slate-900" th:text="${page.number + 1}">1</span>
        <span th:if="${page.totalPages > 0}">/ <span th:text="${page.totalPages}">1</span></span>
    </div>
    <div class="flex items-center gap-2">
        <a th:if="${page.hasPrevious()}"
           th:href="@{''(page=${page.number - 1}, status=${status})}"
           class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 font-medium transition">
            Trang trước
        </a>
        <a th:if="${page.hasNext()}"
           th:href="@{''(page=${page.number + 1}, status=${status})}"
           class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 font-medium transition">
            Trang sau
        </a>
    </div>
</nav>
</body>
</html>
