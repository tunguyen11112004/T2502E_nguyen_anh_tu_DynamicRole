<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased flex flex-col">
<header th:replace="~{fragments/nav :: bar}"></header>
<main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow-xs p-6 sm:p-8">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-slate-900">Đăng ký</h1>
            <p class="text-sm text-slate-500 mt-1">Tạo tài khoản mới (mặc định nhận vai trò học viên).</p>
        </div>

        <form th:action="@{/register}" th:object="${form}" method="post" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">Tên đăng nhập</label>
                <input id="username" th:field="*{username}" maxlength="50" required
                       class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
                <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}"
                      class="block mt-1 text-xs font-medium text-rose-600"></span>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Mật khẩu</label>
                <input id="password" type="password" th:field="*{password}" maxlength="72" required
                       class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"
                      class="block mt-1 text-xs font-medium text-rose-600"></span>
            </div>
            <div>
                <label for="passwordConfirm" class="block text-sm font-medium text-slate-700 mb-1.5">Nhập lại mật khẩu</label>
                <input id="passwordConfirm" type="password" th:field="*{passwordConfirm}" maxlength="72" required
                       class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
                <span th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"
                      class="block mt-1 text-xs font-medium text-rose-600"></span>
            </div>
            <div class="pt-2 flex flex-col gap-3">
                <button type="submit"
                        class="w-full py-2.5 px-4 rounded-xl bg-indigo-600 text-white font-medium text-sm hover:bg-indigo-700 shadow-xs transition cursor-pointer">
                    Tạo tài khoản
                </button>
                <p class="text-center text-sm text-slate-600">
                    Đã có tài khoản?
                    <a th:href="@{/login}" class="font-medium text-indigo-600 hover:text-indigo-700">Đăng nhập</a>
                </p>
            </div>
        </form>
    </div>
</main>
</body>
</html>
